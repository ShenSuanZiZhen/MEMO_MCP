name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: format-lint-test-build-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate pnpm
        run: corepack prepare pnpm@12.4.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Contract tests
        run: pnpm test:contract

      - name: Build
        run: pnpm build

      - name: Dependency scan
        run: pnpm dependency:scan

      - name: Secret scan
        run: pnpm secret:scan
